<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLLECTIONS · SOUL CARTEL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Cinzel:wght@600&display=swap" rel="stylesheet">

<style>
  /* SHADOW MODE OVERLAY */
#shadowMode {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #050505 0%, #000 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease;
}

#shadowMode.active {
  opacity: 1;
  pointer-events: all;
}

/* TEXT */
.shadowText {
  font-family: serif;
  font-size: clamp(20px, 4vw, 42px);
  letter-spacing: 0.4em;
  color: rgba(255,255,255,0.85);
  animation: pulseText 3.5s infinite ease-in-out;
  text-align: center;
}

/* TEXT ANIMATION */
@keyframes pulseText {
  0% {
    opacity: 0.15;
    transform: scale(0.98);
  }
  50% {
    opacity: 1;
    transform: scale(1);
  }
  100% {
    opacity: 0.15;
    transform: scale(0.98);
  }
}
:root{
  --bg:#000;
  --panel:#0c0c0c;
  --text:#f2f2f2;
  --muted:rgba(255,255,255,.55);
  --silver:#bfbfbf;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:radial-gradient(circle at top,#0b0b0b,#000);
  color:var(--text);
  font-family:Inter,sans-serif;
  overflow-x:hidden;
}

/* NAV */
nav{
  position:fixed;
  top:24px;
  right:32px;
  display:flex;
  gap:24px;
  z-index:10;
}
nav a{
  color:var(--muted);
  text-decoration:none;
  font-size:.7rem;
  letter-spacing:.25em;
}
nav a:hover{color:var(--text)}

/* HERO */
.hero{
  height:50vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hero h1{
  font-family: Cinzel, serif;
  font-size: clamp(2.2rem, 6vw, 4.5rem);
  letter-spacing: clamp(.15em, 2vw, .4em);
  text-align: center;
  padding: 0 1rem;
  color: var(--silver);
  max-width: 100%;
  word-break: keep-all;
}

/* DEPTH WRAPPER */
.depth{
  perspective:1200px;
  padding:8rem 10vw 10rem;
}

/* COLLECTION GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:4rem;
}

/* CARD */
.card{
  position:relative;
  height:360px;
  background:var(--panel);
  border-radius:18px;
  transform-style:preserve-3d;
  transform:translateZ(-40px);
  transition:transform .6s cubic-bezier(.22,1,.36,1),
             box-shadow .6s cubic-bezier(.22,1,.36,1);
  box-shadow:
    0 40px 80px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,255,255,.05);
}

/* SHADOW PLANE */
.card::before{
  content:"";
  position:absolute;
  inset:-30px;
  background:rgba(0,0,0,.6);
  filter:blur(60px);
  z-index:-1;
}

/* HOVER DEPTH */
.card:hover{
  transform:translateZ(40px);
  box-shadow:
    0 70px 120px rgba(0,0,0,.9),
    inset 0 1px 0 rgba(255,255,255,.08);
}

/* CONTENT */
.inner{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:3rem;
  transform:translateZ(40px);
}

.inner h3{
  font-family:Cinzel,serif;
  letter-spacing:.3em;
  margin-bottom:1rem;
  color:var(--silver);
}

.inner p{
  font-size:.85rem;
  letter-spacing:.12em;
  color:var(--muted);
  max-width:240px;
}

/* FOOTER */
footer{
  padding:4rem 10vw;
  text-align:center;
  font-size:.7rem;
  letter-spacing:.25em;
  color:rgba(255,255,255,.4);
  border-top:1px solid rgba(255,255,255,.08);
}
</style>
</head>

<body>
  <div id="shadowMode">
  <div class="shadowText">
    THE SITE IS EVOLVING
  </div>
  </div>
  

<script>
  if (localStorage.getItem("cartel_sealed") === "true") {
    location.replace("gate.html");
  }
</script>

<nav>
  <a href="home.html">HOME</a>
  <a href="collections.html">COLLECTIONS</a>
</nav>

<section class="hero">
  <h1>COLLECTIONS</h1>
</section>

<section class="depth">
  <div class="grid">

    <div class="card">
      <div class="inner">
        <h3>OBSIDIAN</h3>
        <p>Heavy silhouettes. Matte control.</p>
      </div>
    </div>

    <div class="card">
      <div class="inner">
        <h3>BLOODLINE</h3>
        <p>Limited cuts. Silent aggression.</p>
      </div>
    </div>

    <div class="card">
      <div class="inner">
        <h3>VOID</h3>
        <p>Reduced form. Absolute presence.</p>
      </div>
    </div>

  </div>
</section>

<footer>
  <div id="markCorner"></div>

<script>
  document.getElementById("markCorner").innerText =
    `THE MARK: ${localStorage.getItem("THE_MARK")}`;
</script>
© 2025 SOUL CARTEL · ALL ACCESS CONTROLLED
</footer>
<div id="markOverlay">
  <div class="markBox">
    <div class="markTitle">YOU HAVE BEEN MARKED</div>
    <div class="markValue"></div>
  </div>
</div>

<script src="js/mark.js"></script>
<script>
  const isNew = localStorage.getItem("MARK_NEW") === "true";
  const overlay = document.getElementById("markOverlay");
  const markValue = document.querySelector(".markValue");

  markValue.innerText = localStorage.getItem("THE_MARK");

  if (isNew) {
    overlay.classList.add("show");
    setTimeout(() => {
      overlay.classList.remove("show");
      localStorage.removeItem("MARK_NEW");
    }, 3500);
  }
</script>
<script src="js/mark.js"></script>
  <script>
  if (localStorage.getItem("shadow_mode") === "true") {
    document.getElementById("shadowOverlay")?.classList.add("active");
  }
  </script>
</body>
</html>
