<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COLLECTIONS · MALEVOLENT SHRINE</title>  <!-- ACCESS GUARD -->  <script>
    if (sessionStorage.getItem("cartel_access") !== "granted") {
      window.location.replace("gate.html");
    }
  </script>  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">  <style>
    :root{
      --bg:#050505;
      --text:#eee;
      --muted:rgba(255,255,255,.45);
      --red:#7a0000;
      --depth:60px;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      background:radial-gradient(circle at top,#0c0c0c,#000 70%);
      color:var(--text);
      font-family:Inter,sans-serif;
      min-height:100vh;
      overflow-x:hidden;
      perspective:1200px;
    }

    /* subtle moving grain */
    body::after{
      content:"";
      position:fixed;
      inset:0;
      background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.04"/></svg>');
      pointer-events:none;
      mix-blend-mode:overlay;
      animation:grain 6s steps(6) infinite;
    }

    @keyframes grain{to{transform:translate(-20px,20px)}}

    header{
      text-align:center;
      padding:4rem 1rem 2rem;
    }

    header h1{
      font-family:Cinzel,serif;
      letter-spacing:.45em;
      font-size:1.1rem;
      opacity:.8;
    }

    header p{
      margin-top:1rem;
      font-size:.7rem;
      letter-spacing:.35em;
      color:var(--muted);
    }

    /* SHRINE FIELD */
    .shrine{
      position:relative;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:4rem;
      padding:4rem 6vw 6rem;
      transform-style:preserve-3d;
    }

    /* floating altar cards */
    .artifact{
      position:relative;
      height:320px;
      transform-style:preserve-3d;
      transition:transform .6s ease, box-shadow .6s ease;
      cursor:pointer;
    }

    .artifact::before{
      content:"";
      position:absolute;
      inset:-10px;
      background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 60%);
      transform:translateZ(calc(var(--depth) * -1));
      filter:blur(18px);
      opacity:.35;
    }

    .artifact:hover{
      transform:rotateY(-12deg) rotateX(6deg) translateZ(20px);
    }

    .slab{
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,#0b0b0b,#020202);
      border:1px solid rgba(255,255,255,.08);
      transform:translateZ(var(--depth));
      padding:2rem;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .slab h2{
      font-family:Cinzel,serif;
      font-size:.85rem;
      letter-spacing:.35em;
      opacity:.9;
    }

    .sigil{
      width:100%;
      height:140px;
      border:1px dashed rgba(255,255,255,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:.6rem;
      letter-spacing:.4em;
      color:var(--muted);
      animation:breathe 5s ease-in-out infinite;
    }

    @keyframes breathe{
      0%,100%{opacity:.4}
      50%{opacity:1}
    }

    .meta{
      font-size:.6rem;
      letter-spacing:.3em;
      color:var(--muted);
    }

    /* ritual hover glow */
    .artifact:hover .slab{
      box-shadow:0 40px 80px rgba(122,0,0,.25);
    }

    /* page veil for transitions */
    .veil{
      position:fixed;
      inset:0;
      background:#000;
      opacity:0;
      pointer-events:none;
      transition:opacity .8s ease;
      z-index:50;
    }

    .veil.show{opacity:1}

    footer{
      text-align:center;
      padding-bottom:3rem;
      font-size:.6rem;
      letter-spacing:.35em;
      color:var(--muted);
      opacity:.5;
    }
  </style></head><body><div class="veil" id="veil"></div><header>
  <h1>COLLECTIONS</h1>
  <p>ARTIFACTS WITHIN THE MALEVOLENT SHRINE</p>
</header><section class="shrine">  <div class="artifact" data-link="artifact-1.html">
    <div class="slab">
      <h2>RELIC I</h2>
      <div class="sigil">SEALED</div>
      <div class="meta">STATUS · DORMANT</div>
    </div>
  </div>  <div class="artifact" data-link="artifact-2.html">
    <div class="slab">
      <h2>RELIC II</h2>
      <div class="sigil">RESTRICTED</div>
      <div class="meta">STATUS · WATCHED</div>
    </div>
  </div>  <div class="artifact" data-link="artifact-3.html">
    <div class="slab">
      <h2>RELIC III</h2>
      <div class="sigil">FORBIDDEN</div>
      <div class="meta">STATUS · ACTIVE</div>
    </div>
  </div></section><footer>ENTER AT YOUR OWN RISK</footer><script>
  // cinematic transition on click
  document.querySelectorAll('.artifact').forEach(card=>{
    card.addEventListener('click',()=>{
      const veil=document.getElementById('veil');
      veil.classList.add('show');
      setTimeout(()=>{
        location.href=card.dataset.link;
      },800);
    })
  })
</script></body>
</html>
