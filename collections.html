<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>COLLECTIONS · SOUL CARTEL</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --text:#f2f2f2;
  --muted:rgba(255,255,255,.55);
  --silver:#bfbfbf;
  --red:#8b0000;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:radial-gradient(circle at top,#0b0b0b,#000);
  color:var(--text);
  font-family:Inter,sans-serif;
  overflow-x:hidden;
}

/* NAV */
nav{
  position:fixed;
  top:24px;
  right:32px;
  display:flex;
  gap:24px;
  z-index:10;
}

nav a{
  color:var(--muted);
  text-decoration:none;
  font-size:.7rem;
  letter-spacing:.25em;
}

nav a:hover{color:var(--text)}

/* HERO */
.hero{
  height:60vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h1{
  font-family:Cinzel,serif;
  letter-spacing:.4em;
  font-size:clamp(2.5rem,6vw,5rem);
  color:var(--silver);
  text-shadow:0 0 40px rgba(255,255,255,.12);
}

/* SHRINE FLOOR */
.shrine{
  padding:8rem 10vw;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:4rem;
  perspective:1200px;
}

/* ALTAR CARD */
.altar{
  position:relative;
  height:360px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  transform-style:preserve-3d;
  transform:translateZ(-40px);
  transition:1s cubic-bezier(.22,1,.36,1);
  animation:breath 6s ease-in-out infinite;
}

.altar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:24px;
  box-shadow:0 0 80px rgba(139,0,0,.15);
  opacity:.6;
}

.altar:hover{
  transform:translateZ(40px) rotateX(6deg);
  box-shadow:0 60px 140px rgba(0,0,0,.8);
}

@keyframes breath{
  0%,100%{transform:translateZ(-40px)}
  50%{transform:translateZ(0)}
}

.altar-inner{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transform:translateZ(40px);
  text-align:center;
}

.altar h3{
  font-family:Cinzel,serif;
  letter-spacing:.3em;
  margin-bottom:1rem;
  color:var(--silver);
}

.altar p{
  font-size:.85rem;
  letter-spacing:.15em;
  color:var(--muted);
  max-width:220px;
}

/* FOOTER */
footer{
  padding:4rem 10vw;
  text-align:center;
  font-size:.7rem;
  letter-spacing:.25em;
  color:rgba(255,255,255,.4);
  border-top:1px solid rgba(255,255,255,.08);
}
</style>
</head>

<body>

<nav>
  <a href="home.html">HOME</a>
  <a href="collections.html">COLLECTIONS</a>
</nav>

<section class="hero">
  <h1>COLLECTIONS</h1>
</section>

<section class="shrine">

  <div class="altar">
    <div class="altar-inner">
      <h3>OBSIDIAN</h3>
      <p>Heavy silhouettes forged in silence.</p>
    </div>
  </div>

  <div class="altar">
    <div class="altar-inner">
      <h3>BLOODLINE</h3>
      <p>Limited release. Bound by ritual.</p>
    </div>
  </div>

  <div class="altar">
    <div class="altar-inner">
      <h3>VOID</h3>
      <p>Minimal form. Maximum presence.</p>
    </div>
  </div>

</section>

<footer>
© 2025 SOUL CARTEL · CURATED IN SHADOW
</footer>

</body>
</html>
