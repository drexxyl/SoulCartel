<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>COLLECTIONS · SOUL CARTEL</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cinzel:wght@600&display=swap" rel="stylesheet">

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>

  <style>
    :root {
      --bg: #000;
      --text: #f5f5f5;
      --muted: rgba(255,255,255,0.55);
      --silver: #bfbfbf;
      --red: #8b0000;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0b0b0b, #000);
      color: var(--text);
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 24px;
      right: 32px;
      z-index: 20;
      display: flex;
      gap: 24px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      position: relative;
    }

    nav a::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--silver);
      transition: width .4s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    header {
      height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(3rem, 7vw, 6rem);
      letter-spacing: 0.25em;
      color: var(--silver);
    }

    section {
      min-height: 100vh;
      position: relative;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .overlay {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
      gap: 4rem;
      padding: 12rem 10vw;
    }

    .collection-card {
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 3rem;
      border-radius: 22px;
      transition: transform .6s cubic-bezier(.22,1,.36,1);
    }

    .collection-card:hover {
      transform: translateY(-12px);
      border-color: rgba(255,255,255,0.25);
    }

    .collection-card h2 {
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      color: var(--silver);
    }

    .collection-card p {
      color: var(--muted);
      line-height: 1.8;
    }

    footer {
      text-align: center;
      padding: 4rem 0;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.4);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">HOME</a>
  <a href="about.html">ABOUT</a>
  <a href="collections.html">COLLECTIONS</a>
</nav>

<canvas id="scene"></canvas>

<header>
  <h1>COLLECTIONS</h1>
</header>

<section>
  <div class="overlay">
    <div class="collection-card">
      <h2>OBSIDIAN</h2>
      <p>
        Heavyweight silhouettes forged in silence.
        Matte textures. Controlled mass.
      </p>
    </div>

    <div class="collection-card">
      <h2>BLOODLINE</h2>
      <p>
        Limited circulation.
        Deep crimson undertones.
        Precision cuts.
      </p>
    </div>

    <div class="collection-card">
      <h2>VOID</h2>
      <p>
        Reduction to essence.
        Minimal form.
        Maximum presence.
      </p>
    </div>
  </div>
</section>

<footer>
  © 2025 SOUL CARTEL · NOTHING IS RANDOM
</footer>

<script>
  const canvas = document.getElementById("scene");
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.z = 7;

  const renderer = new THREE.WebGLRenderer({
    canvas,
    alpha: true,
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const objects = [];

  const material = new THREE.MeshStandardMaterial({
    color: 0xaaaaaa,
    metalness: 1,
    roughness: 0.2
  });

  const geometries = [
    new THREE.IcosahedronGeometry(1.2, 0),
    new THREE.TorusGeometry(1.1, 0.35, 16, 100),
    new THREE.OctahedronGeometry(1.2)
  ];

  geometries.forEach((geo, i) => {
    const mesh = new THREE.Mesh(geo, material.clone());
    mesh.position.x = (i - 1) * 3.2;
    scene.add(mesh);
    objects.push(mesh);
  });

  scene.add(new THREE.AmbientLight(0xffffff, 0.4));

  const keyLight = new THREE.PointLight(0xffffff, 1.2);
  keyLight.position.set(5, 5, 5);
  scene.add(keyLight);

  const redLight = new THREE.PointLight(0x8b0000, 1);
  redLight.position.set(-5, -5, -5);
  scene.add(redLight);

  const clock = new THREE.Clock();

  function animate() {
    const t = clock.getElapsedTime();
    objects.forEach((obj, i) => {
      obj.rotation.y += 0.002 + i * 0.0005;
      obj.rotation.x = Math.sin(t * 0.3 + i) * 0.1;
    });
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
