<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUL CARTEL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Cinzel:wght@600&display=swap" rel="stylesheet">

<style>
:root{
--black:#000;
--silver:#bfbfbf;
--muted:rgba(255,255,255,.6);
--red:#8b0000;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
background:#000;
color:#fff;
font-family:'Inter',sans-serif;
overflow-x:hidden;
}

/* ================= INTRO ================= */

#intro{
position:fixed;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
z-index:99999;
transition:opacity 2s ease;
}

/* Solar glow */
.sun{
position:absolute;
width:800px;
height:800px;
background:radial-gradient(circle,#8b0000 0%,rgba(139,0,0,.5) 35%,transparent 70%);
filter:blur(80px);
top:-200px;
animation:pulse 4s infinite alternate ease-in-out;
}

@keyframes pulse{
from{transform:scale(1)}
to{transform:scale(1.1)}
}

/* Wing silhouette */
.wings{
position:absolute;
width:min(80vw,700px);
height:400px;
background:linear-gradient(90deg,transparent 0%,#111 40%,#111 60%,transparent 100%);
clip-path:polygon(
0% 60%,10% 50%,20% 40%,30% 30%,40% 20%,50% 10%,60% 20%,70% 30%,80% 40%,90% 50%,100% 60%,
100% 70%,90% 65%,80% 60%,70% 55%,60% 50%,50% 45%,40% 50%,30% 55%,20% 60%,10% 65%,0% 70%
);
opacity:0;
transform:translateY(80px) scale(.95);
animation:rise 3.5s ease forwards 1s;
}

@keyframes rise{
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

/* Fire overlay */
.fire{
position:absolute;
width:min(80vw,700px);
height:400px;
background:radial-gradient(circle at center,#ff3c00 0%,transparent 70%);
mix-blend-mode:screen;
opacity:0;
animation:ignite 2s ease forwards 4.5s;
}

@keyframes ignite{
to{opacity:.7}
}

/* Text */
.introText{
position:absolute;
bottom:18%;
text-align:center;
opacity:0;
animation:textReveal 2s ease forwards 6.5s;
}

.introText h1{
font-family:'Cinzel',serif;
font-size:clamp(1.8rem,6vw,3rem);
letter-spacing:.4em;
}

.introText p{
margin-top:1rem;
letter-spacing:.5em;
color:#8b0000;
}

@keyframes textReveal{
to{opacity:1}
}

/* ================= NAV ================= */

nav{
position:fixed;
top:24px;
right:32px;
z-index:10;
display:flex;
gap:24px;
}

nav a{
color:var(--muted);
text-decoration:none;
letter-spacing:.25em;
font-size:.7rem;
}

/* ================= HERO ================= */

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:radial-gradient(circle at top,#0b0b0b,#000);
}

.hero h1{
font-family:'Cinzel',serif;
font-size:clamp(3rem,8vw,6rem);
letter-spacing:.2em;
color:var(--silver);
}

.hero p{
margin-top:1rem;
letter-spacing:.3em;
color:var(--muted);
}

footer{
padding:4rem;
text-align:center;
border-top:1px solid rgba(255,255,255,.08);
font-size:.75rem;
letter-spacing:.25em;
color:rgba(255,255,255,.4);
}
</style>
</head>

<body>

<!-- ================= ICARUS INTRO ================= -->

<div id="intro">
<div class="sun"></div>
<div class="wings"></div>
<div class="fire"></div>

<div class="introText">
<h1>ICARUS FELL.</h1>
<p>WE ASCEND</p>
</div>
</div>

<!-- ================= NAV ================= -->

<nav>
<a href="#">HOME</a>
<a href="#">ABOUT</a>
<a href="#">COLLECTIONS</a>
</nav>

<!-- ================= HERO ================= -->

<section class="hero">
<div>
<h1>SOUL CARTEL</h1>
<p>BUILT FROM SOUL · RULED BY CARTEL</p>
</div>
</section>

<footer>
© 2025 SOUL CARTEL · ALL ACCESS CONTROLLED
</footer>

<script>
/* Fade intro */
setTimeout(()=>{
document.getElementById("intro").style.opacity="0";
setTimeout(()=>{
document.getElementById("intro").remove();
},2000);
},9000);

/* Subtle mouse parallax */
document.addEventListener("mousemove",(e)=>{
const x=(e.clientX/window.innerWidth-.5)*20;
const y=(e.clientY/window.innerHeight-.5)*20;
const wings=document.querySelector(".wings");
const sun=document.querySelector(".sun");
if(wings && sun){
wings.style.transform=`translateY(0) scale(1) rotateY(${x}deg)`;
sun.style.transform=`translate(${x}px,${y}px) scale(1.05)`;
}
});
</script>

</body>
</html>
