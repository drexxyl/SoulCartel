<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DOMAIN · V.</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>

<style>
:root{
  --text:#f5f5f5;
  --muted:rgba(255,255,255,.45);
  --glass:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.15);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  background:#000;
  color:var(--text);
  font-family:Inter,sans-serif;
  overflow:hidden;
}

/* CANVAS */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

/* UI LAYER */
.ui{
  position:relative;
  z-index:2;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* PANEL */
.panel{
  padding:3rem 3.5rem;
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(16px);
  border-radius:20px;
  max-width:90vw;
}

/* TEXT */
h1{
  font-family:Cinzel,serif;
  font-size:clamp(2rem,6vw,3rem);
  letter-spacing:.4em;
  margin-bottom:1rem;
}

p{
  font-size:.7rem;
  letter-spacing:.3em;
  color:var(--muted);
}

/* BUTTONS */
.controls{
  margin-top:3rem;
  display:flex;
  flex-wrap:wrap;
  gap:1.5rem;
  justify-content:center;
}

button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  padding:.8rem 1.6rem;
  font-size:.65rem;
  letter-spacing:.25em;
  cursor:pointer;
  transition:.4s;
}

button:hover{
  border-color:white;
  background:rgba(255,255,255,.08);
}

/* STATUS */
.status{
  margin-top:2rem;
  font-size:.6rem;
  letter-spacing:.3em;
  opacity:.6;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="ui">
  <div class="panel">
    <h1>DOMAIN COGNIZED</h1>
    <p>AUTHORITY · V.</p>

    <div class="controls">
<button id="unseal">UNSEAL SITE</button>
      <button onclick="enterWorld()">ENTER WORLD</button>
      <button onclick="killSwitch()">KILL SWITCH</button>
      <button onclick="toggleShadow()">SHADOW MODE</button>
    </div>

    <div class="status" id="status">REALITY · UNSEALED</div>
  </div>
</div>

<script>
/* ===== THREE.JS BACKGROUND ===== */
const canvas = document.getElementById("bg");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  100
);
camera.position.z = 4;

const renderer = new THREE.WebGLRenderer({
  canvas,
  alpha:true,
  antialias:true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

/* OBJECT */
const geo = new THREE.TorusKnotGeometry(1,0.3,120,16);
const mat = new THREE.MeshStandardMaterial({
  color:0xaaaaaa,
  metalness:1,
  roughness:0.15
});
const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xffffff,0.4));

const key = new THREE.PointLight(0xffffff,1);
key.position.set(5,5,5);
scene.add(key);

const fill = new THREE.PointLight(0x8b0000,0.8);
fill.position.set(-5,-5,-5);
scene.add(fill);

/* ANIMATE */
const clock = new THREE.Clock();
function animate(){
  const t = clock.getElapsedTime();
  mesh.rotation.y = t * 0.25;
  mesh.rotation.x = Math.sin(t * 0.2) * 0.2;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

/* RESIZE */
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

/* ===== ADMIN POWERS ===== */
function enterWorld(){
  location.href="home.html";
}

function killSwitch(){
  localStorage.setItem("cartel_sealed","true");
  localStorage.removeItem("cartel_access");
  document.getElementById("status").innerText = "REALITY · SEALED";
}

function toggleShadow(){
  const s = localStorage.getItem("cartel_shadow")==="true";
  localStorage.setItem("cartel_shadow",!s);
  document.getElementById("status").innerText =
    !s ? "MODE · SHADOW" : "MODE · VISIBLE";
}
</script>
<script>
const unsealBtn = document.getElementById("unseal");

if(unsealBtn){
  unsealBtn.addEventListener("click", ()=>{
    localStorage.removeItem("cartel_sealed");
    alert("SITE UNSEALED");
  });
}
</script>
</body>
</html>
