<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ADMIN · SOUL CARTEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>

<style>
:root{
  --text:#f5f5f5;
  --muted:rgba(255,255,255,.45);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  color:var(--text);
  font-family:Inter,sans-serif;
  height:100vh;
  overflow:hidden;
}

canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

.ui{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

h1{
  font-family:Cinzel,serif;
  letter-spacing:.5em;
  font-size:2.8rem;
}

p{
  margin-top:1.4rem;
  font-size:.75rem;
  letter-spacing:.35em;
  color:var(--muted);
}

.actions{
  margin-top:2.4rem;
}

.actions button{
  background:transparent;
  border:1px solid rgba(255,255,255,.2);
  color:white;
  padding:.6rem 1.4rem;
  margin:.4rem;
  font-size:.65rem;
  letter-spacing:.3em;
  cursor:pointer;
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="ui">
  <div>
    <h1>WELCOME</h1>
    <p>ORIGIN · ARCHITECT · V.</p>

    <div class="actions">
      <button onclick="location.href='home.html'">ENTER SITE</button>
      <button onclick="logout()">LOCK WORLD</button>
    </div>
  </div>
</div>

<script>
// 🔒 HARD ADMIN LOCK
if(sessionStorage.getItem("cartel_admin")!=="true"){
  location.href="gate.html";
}

// LOGOUT
function logout(){
  sessionStorage.clear();
  location.href="gate.html";
}

// ===== THREE.JS (SAME LEVEL AS HOME) =====
const canvas = document.getElementById("scene");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.z = 4;

const renderer = new THREE.WebGLRenderer({
  canvas,
  alpha:true,
  antialias:true,
  powerPreference:"high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

// Geometry (clean, godlike)
const geometry = new THREE.TorusKnotGeometry(1,0.25,120,16);
const material = new THREE.MeshStandardMaterial({
  color:0xbfbfbf,
  metalness:1,
  roughness:0.15
});
const sigil = new THREE.Mesh(geometry, material);
scene.add(sigil);

// Lights
scene.add(new THREE.AmbientLight(0xffffff,.35));

const keyLight = new THREE.PointLight(0xffffff,1);
keyLight.position.set(5,5,5);
scene.add(keyLight);

const bloodLight = new THREE.PointLight(0x8b0000,.8);
bloodLight.position.set(-4,-4,-4);
scene.add(bloodLight);

// Animate
const clock = new THREE.Clock();
function animate(){
  const t = clock.getElapsedTime();
  sigil.rotation.y = t * 0.18;
  sigil.rotation.x = Math.sin(t * 0.3) * 0.12;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

// Resize
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
