<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOMAIN · ADMIN</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --text:#f2f2f2;
  --muted:rgba(255,255,255,.45);
  --accent:#8b0000;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:radial-gradient(circle at top,#0c0c0c,#000 70%);
  color:var(--text);
  font-family:Inter,sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1200px;
}

/* DEPTH CORE */
.core{
  position:absolute;
  inset:-25%;
  background:
    radial-gradient(circle at 30% 40%, rgba(255,255,255,.06), transparent 45%),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.04), transparent 50%);
  filter:blur(50px);
  transform:translateZ(-300px);
}

/* CONTAINER */
.admin{
  position:relative;
  text-align:center;
  transform-style:preserve-3d;
  z-index:2;
}

/* TITLE */
h1{
  font-family:Cinzel,serif;
  font-size:clamp(2.2rem,6vw,3rem);
  letter-spacing:.45em;
  max-width:90vw;
  margin:0 auto;
  transform:translateZ(80px) translateX(.22em);
  animation:breathe 4s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{opacity:.6}
  50%{opacity:1}
}

/* SUB */
p{
  margin-top:1.2rem;
  font-size:clamp(.6rem,2.5vw,.75rem);
  letter-spacing:.32em;
  color:var(--muted);
  transform:translateZ(60px) translateX(.16em);
}

/* PANEL */
.panel{
  margin-top:3rem;
  display:flex;
  gap:1.4rem;
  justify-content:center;
  flex-wrap:wrap;
  transform:translateZ(120px);
}

button{
  background:transparent;
  border:1px solid rgba(255,255,255,.25);
  color:white;
  padding:.8rem 1.6rem;
  letter-spacing:.25em;
  font-size:.65rem;
  cursor:pointer;
  transition:.4s;
}

button:hover{
  background:rgba(255,255,255,.05);
}

/* STATUS */
.status{
  margin-top:2rem;
  font-size:.6rem;
  letter-spacing:.3em;
  opacity:.6;
  transform:translateZ(40px);
}

/* MOBILE FIX */
@media(max-width:480px){
  h1{letter-spacing:.38em}
  p{letter-spacing:.28em}
}
</style>
</head>

<body>

<div class="core"></div>

<div class="admin" id="admin">
  <h1>DOMAIN COGNIZED</h1>
  <p>AUTHORITY · V.</p>

  <div class="panel">
    <button onclick="enterWorld()">ENTER WORLD</button>
    <button onclick="sealDomain()">SEAL DOMAIN</button>
  </div>

  <div class="status" id="status">
    DOMAIN STATE · UNSEALED
  </div>
</div>

<script>
/* PARALLAX */
document.addEventListener("mousemove", e=>{
  const x=(e.clientX/window.innerWidth-.5)*10;
  const y=(e.clientY/window.innerHeight-.5)*10;
  document.getElementById("admin").style.transform=
    `rotateX(${-y}deg) rotateY(${x}deg)`;
});

/* CONTROLS */
function enterWorld(){
  sessionStorage.setItem("cartel_access","true");
  location.href="home.html";
}

function sealDomain(){
  document.getElementById("status").innerText="DOMAIN STATE · SEALED";
  document.body.style.filter="contrast(1.1)";
}
</script>

</body>
</html>
