<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOMAIN · V.</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --text:#f2f2f2;
  --muted:rgba(255,255,255,.45);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  background:#000;
  color:var(--text);
  font-family:Inter,sans-serif;
  overflow:hidden;
}

/* DEPTH LAYERS */
.layer{
  position:absolute;
  inset:-20%;
  background:
    radial-gradient(circle at 30% 40%, rgba(255,255,255,.06), transparent 45%),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.04), transparent 50%);
  filter:blur(60px);
}

.layer.back{transform:translateZ(-400px)}
.layer.mid{transform:translateZ(-200px)}
.layer.front{transform:translateZ(-80px)}

.scene{
  position:relative;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1400px;
}

.core{
  text-align:center;
  transform-style:preserve-3d;
}

/* TEXT */
h1{
  font-family:Cinzel,serif;
  font-size:clamp(2.4rem,7vw,3.2rem);
  letter-spacing:.45em;
  transform:translateZ(120px) translateX(.22em);
  animation:breathe 4s ease-in-out infinite;
}

p{
  margin-top:1.4rem;
  font-size:.7rem;
  letter-spacing:.32em;
  color:var(--muted);
  transform:translateZ(90px) translateX(.16em);
}

@keyframes breathe{
  0%,100%{opacity:.55}
  50%{opacity:1}
}

/* COMMANDS */
.commands{
  margin-top:4rem;
  display:flex;
  gap:2rem;
  justify-content:center;
  transform:translateZ(160px);
}

.cmd{
  font-size:.65rem;
  letter-spacing:.25em;
  cursor:pointer;
  opacity:.6;
  transition:.4s;
}

.cmd:hover{opacity:1}

/* STATUS */
.status{
  margin-top:2.5rem;
  font-size:.6rem;
  letter-spacing:.3em;
  opacity:.5;
  transform:translateZ(60px);
}

/* MOBILE */
@media(max-width:480px){
  h1{letter-spacing:.38em}
  p{letter-spacing:.28em}
}
</style>
</head>

<body>

<div class="layer back"></div>
<div class="layer mid"></div>
<div class="layer front"></div>

<div class="scene">
  <div class="core" id="core">
    <h1>DOMAIN COGNIZED</h1>
    <p>AUTHORITY · V.</p>

    <div class="commands">
      <div class="cmd" onclick="enterWorld()">ENTER WORLD</div>
      <div class="cmd" onclick="killSwitch()">KILL SWITCH</div>
      <div class="cmd" onclick="toggleShadow()">SHADOW MODE</div>
    </div>

    <div class="status" id="status">
      REALITY · UNSEALED
    </div>
  </div>
</div>

<script>
/* PARALLAX — ALWAYS ALIVE */
let x=0,y=0;
document.addEventListener("mousemove",e=>{
  x=(e.clientX/window.innerWidth-.5)*10;
  y=(e.clientY/window.innerHeight-.5)*10;
});
function animate(){
  document.getElementById("core").style.transform=
    `rotateX(${-y}deg) rotateY(${x}deg)`;
  requestAnimationFrame(animate);
}
animate();

/* POWERS */
function enterWorld(){
  sessionStorage.setItem("cartel_access","true");
  location.href="home.html";
}

function killSwitch(){
  localStorage.setItem("cartel_sealed","true");
  document.getElementById("status").innerText="REALITY · SEALED";
}

function toggleShadow(){
  const s=localStorage.getItem("cartel_shadow")==="true";
  localStorage.setItem("cartel_shadow",!s);
  document.getElementById("status").innerText=
    !s?"MODE · SHADOW":"MODE · VISIBLE";
}
</script>

</body>
</html>
