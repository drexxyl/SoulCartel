<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOMAIN · V.</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>

<style>
:root{
  --text:#f5f5f5;
  --muted:rgba(255,255,255,.4);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  color:var(--text);
  font-family:Inter,sans-serif;
  height:100vh;
  overflow:hidden;
}

canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

.ui{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  pointer-events:none;
}

h1{
  font-family:Cinzel,serif;
  letter-spacing:.6em;
  font-size:2.6rem;
}

p{
  margin-top:1.2rem;
  font-size:.7rem;
  letter-spacing:.35em;
  color:var(--muted);
}

.panel{
  margin-top:3rem;
  pointer-events:auto;
}

.panel button{
  background:transparent;
  border:1px solid rgba(255,255,255,.2);
  color:white;
  padding:.6rem 1.4rem;
  margin:.4rem;
  font-size:.65rem;
  letter-spacing:.3em;
  cursor:pointer;
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="ui">
  <div>
    <h1>DOMAIN RECOGNIZED</h1>
    <p>AUTHORITY · V.</p>

    <div class="panel">
      <button onclick="location.href='home.html'">ENTER WORLD</button>
      <button onclick="lock()">SEAL DOMAIN</button>
    </div>
  </div>
</div>

<script>
/* ===== HARD ADMIN CHECK ===== */
if(sessionStorage.getItem("cartel_admin")!=="true"){
  location.href="gate.html";
}

function lock(){
  sessionStorage.clear();
  location.href="gate.html";
}

/* ===== THREE.JS DOMAIN ===== */
const canvas = document.getElementById("scene");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({
  canvas,
  alpha:true,
  antialias:true,
  powerPreference:"high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

/* === CORE SIGIL === */
const coreGeo = new THREE.TorusKnotGeometry(1.3,0.25,140,18);
const coreMat = new THREE.MeshStandardMaterial({
  color:0xbfbfbf,
  metalness:1,
  roughness:0.18
});
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

/* === SENTINELS (ORBITING) === */
const sentinels = [];
const sentGeo = new THREE.IcosahedronGeometry(0.25,0);

for(let i=0;i<4;i++){
  const mat = new THREE.MeshStandardMaterial({
    color:0x8b0000,
    metalness:.9,
    roughness:.35
  });
  const s = new THREE.Mesh(sentGeo, mat);
  scene.add(s);
  sentinels.push(s);
}

/* === LIGHTS === */
scene.add(new THREE.AmbientLight(0xffffff,.25));

const mainLight = new THREE.PointLight(0xffffff,1);
mainLight.position.set(5,5,5);
scene.add(mainLight);

const bloodLight = new THREE.PointLight(0x8b0000,.9);
bloodLight.position.set(-6,-4,-3);
scene.add(bloodLight);

/* === ANIMATE === */
const clock = new THREE.Clock();
function animate(){
  const t = clock.getElapsedTime();

  core.rotation.y = t * 0.15;
  core.rotation.x = Math.sin(t * 0.3) * 0.12;

  sentinels.forEach((s,i)=>{
    const a = t * 0.6 + i * Math.PI/2;
    s.position.set(
      Math.cos(a)*2.6,
      Math.sin(a*0.7)*0.6,
      Math.sin(a)*2.6
    );
    s.rotation.y += 0.02;
  });

  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
