<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ACCESS · SOUL CARTEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --text:#eaeaea;
  --muted:rgba(255,255,255,.45);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:radial-gradient(circle at top,#0b0b0b,#000);
  color:var(--text);
  font-family:Inter,sans-serif;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.gate{
  text-align:center;
}

h1{
  font-family:Cinzel,serif;
  letter-spacing:.45em;
  font-size:2.6rem;
}

.status{
  margin-top:1.4rem;
  font-size:.75rem;
  letter-spacing:.35em;
  color:var(--muted);
  min-height:1em;
}

input{
  margin-top:2rem;
  background:transparent;
  border:1px solid rgba(255,255,255,.25);
  padding:.7rem 1rem;
  color:white;
  text-align:center;
  letter-spacing:.3em;
  outline:none;
}

.hidden{opacity:0}
.show{opacity:1}

/* ───────── ANIMATIONS ───────── */

.verify{animation:verify 1.5s infinite}
@keyframes verify{
  0%{opacity:.3}
  50%{opacity:1}
  100%{opacity:.3}
}

.tier-sin{animation:shake .4s linear 3}
@keyframes shake{
  0%{transform:translate(0)}
  25%{transform:translate(-3px,2px)}
  50%{transform:translate(3px,-2px)}
  75%{transform:translate(-2px,3px)}
  100%{transform:translate(0)}
}

.tier-death{animation:fade 2s forwards}
@keyframes fade{
  to{opacity:0}
}

.tier-soul{animation:soft 1.5s forwards}
@keyframes soft{
  from{opacity:.2}
  to{opacity:1}
}

.tier-cartel{animation:rise 1.2s forwards}
@keyframes rise{
  from{transform:translateY(20px);opacity:0}
  to{transform:none;opacity:1}
}

.tier-apocalypse{animation:burn 3s forwards}
@keyframes burn{
  0%{opacity:0}
  100%{opacity:1}
}

.admin-ui{
  position:fixed;
  bottom:20px;
  right:20px;
  font-size:.65rem;
  letter-spacing:.3em;
  opacity:.35;
  display:none;
}
</style>
</head>

<body>

<div class="gate" id="gate">
  <h1>ACCESS</h1>
  <div class="status" id="status">ENTER AUTHORIZATION CODE</div>
  <input id="pw" type="password" autofocus>
</div>

<div class="admin-ui" id="admin">ADMIN · V.</div>

<script>
const ACCESS = {
  "V.":"admin",
  "SIN":"sin",
  "DEATH":"death",
  "SOUL":"soul",
  "CARTEL":"cartel",
  "APOCALYPSE":"apocalypse"
};

const pw = document.getElementById("pw");
const gate = document.getElementById("gate");
const status = document.getElementById("status");
const admin = document.getElementById("admin");

pw.addEventListener("keydown", e=>{
  if(e.key!=="Enter") return;

  const code = pw.value.trim().toUpperCase();
  pw.value="";

  if(!ACCESS[code]){
    status.textContent="ACCESS DENIED";
    gate.classList.add("tier-sin");
    setTimeout(()=>gate.className="gate",600);
    return;
  }

  // VERIFY PHASE
  status.textContent="VERIFYING SOUL SIGNATURE";
  status.classList.add("verify");

  setTimeout(()=>{
    status.classList.remove("verify");
    status.textContent="ACCESS GRANTED";

    const tier = ACCESS[code];
    gate.classList.add(`tier-${tier}`);

    sessionStorage.setItem("cartel_access","true");
    sessionStorage.setItem("cartel_tier",tier);

    if(code==="V."){
      admin.style.display="block";
      sessionStorage.setItem("cartel_admin","true");
    }

    setTimeout(()=>{
      location.href="home.html";
    }, tier==="apocalypse" ? 3000 : 1500);

  },1500);
});
</script>

</body>
</html>
