<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ACCESS · SOUL CARTEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>

<style>
  /* SHADOW MODE OVERLAY */
#shadowMode {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #050505 0%, #000 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease;
}

#shadowMode.active {
  opacity: 1;
  pointer-events: all;
}

/* TEXT */
.shadowText {
  font-family: serif;
  font-size: clamp(20px, 4vw, 42px);
  letter-spacing: 0.4em;
  color: rgba(255,255,255,0.85);
  animation: pulseText 3.5s infinite ease-in-out;
  text-align: center;
}

/* TEXT ANIMATION */
@keyframes pulseText {
  0% {
    opacity: 0.15;
    transform: scale(0.98);
  }
  50% {
    opacity: 1;
    transform: scale(1);
  }
  100% {
    opacity: 0.15;
    transform: scale(0.98);
  }
}
:root{
  --text:#f5f5f5;
  --muted:rgba(255,255,255,.45);
  --red:#8b0000;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  color:var(--text);
  font-family:Inter,sans-serif;
  height:100vh;
  overflow:hidden;
}

canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

.ui{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

h1{
  font-family:Cinzel,serif;
  letter-spacing:.45em;
  font-size:2.4rem;
  opacity:.9;
}

p{
  margin-top:1.2rem;
  font-size:.7rem;
  letter-spacing:.35em;
  color:var(--muted);
}

input{
  margin-top:2.4rem;
  background:transparent;
  border:1px solid rgba(255,255,255,.2);
  color:white;
  padding:.7rem 1.2rem;
  text-align:center;
  letter-spacing:.3em;
  outline:none;
}

.error{
  margin-top:1rem;
  font-size:.65rem;
  letter-spacing:.3em;
  color:var(--red);
  opacity:0;
  transition:.3s;
}

.error.show{opacity:1}

.unlock h1{
  animation:unlock 1.2s forwards;
}

@keyframes unlock{
  0%{opacity:1;letter-spacing:.4em}
  50%{opacity:.4;letter-spacing:1em}
  100%{opacity:0}
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="ui">
  <div class="gate">
    <h1>ACCESS</h1>
    <p>VERIFYING SOUL SIGNATURE</p>
    <input id="pw" type="password" autofocus>
    <div class="error" id="err">ACCESS DENIED</div>
  </div>
</div>

<script>
/* =======================
   PASSWORD SYSTEM
======================= */
const PASSWORDS = ["V.","SIN","DEATH","SOUL","CARTEL","APOCALYPSE"];

const pw = document.getElementById("pw");
const err = document.getElementById("err");
const gate = document.querySelector(".gate");

pw.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const val = pw.value.toUpperCase();

    if(PASSWORDS.includes(val)){
      gate.classList.add("unlock");

      if(val==="V."){
        sessionStorage.setItem("cartel_admin","true");
        setTimeout(()=>location.href="admin.html",1200);
      }else{
        sessionStorage.setItem("cartel_access","true");
        setTimeout(()=>location.href="home.html",1200);
      }

    }else{
      err.classList.add("show");
      pw.value="";
      setTimeout(()=>err.classList.remove("show"),1200);
    }
  }
});

/* =======================
   THREE.JS — LIVING GATE
======================= */
const canvas = document.getElementById("scene");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.z = 4;

const renderer = new THREE.WebGLRenderer({
  canvas,
  alpha:true,
  antialias:true,
  powerPreference:"high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

// Geometry — feels like a seal, not decoration
const geometry = new THREE.TorusGeometry(1.2,0.08,16,120);
const material = new THREE.MeshStandardMaterial({
  color:0xbfbfbf,
  metalness:1,
  roughness:0.25
});
const ring = new THREE.Mesh(geometry, material);
scene.add(ring);

// Lights
scene.add(new THREE.AmbientLight(0xffffff,.3));

const whiteLight = new THREE.PointLight(0xffffff,.9);
whiteLight.position.set(4,4,4);
scene.add(whiteLight);

const redLight = new THREE.PointLight(0x8b0000,.6);
redLight.position.set(-4,-4,-4);
scene.add(redLight);

// Animate — subtle, alive, not distracting
const clock = new THREE.Clock();
function animate(){
  const t = clock.getElapsedTime();
  ring.rotation.y = t * 0.2;
  ring.rotation.x = Math.sin(t * 0.3) * 0.1;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

// Resize
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
<div id="markOverlay">
  <div class="markBox">
    <div class="markTitle">YOU HAVE BEEN MARKED</div>
    <div class="markValue"></div>
  </div>
</div>

<script src="js/mark.js"></script>
<script>
  const isNew = localStorage.getItem("MARK_NEW") === "true";
  const overlay = document.getElementById("markOverlay");
  const markValue = document.querySelector(".markValue");

  markValue.innerText = localStorage.getItem("THE_MARK");

  if (isNew) {
    overlay.classList.add("show");
    setTimeout(() => {
      overlay.classList.remove("show");
      localStorage.removeItem("MARK_NEW");
    }, 3500);
  }
</script> 
<script src="js/mark.js"></script>
  <div id="markCorner"></div>

<script>
  document.getElementById("markCorner").innerText =
    `THE MARK: ${localStorage.getItem("THE_MARK")}`;
</script>
</body>
</html>
