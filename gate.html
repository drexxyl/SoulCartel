<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS · SOUL CARTEL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Cinzel:wght@600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --text:#f5f5f5;
  --muted:rgba(255,255,255,.5);
  --silver:#bfbfbf;
  --red:#8b0000;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  background:radial-gradient(circle at top,#0b0b0b,#000);
  color:var(--text);
  font-family:Inter,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* VEIL */
.veil{
  position:fixed;
  inset:0;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.2s ease;
  z-index:5;
}

/* GATE */
.gate{
  text-align:center;
  z-index:2;
}

.gate h1{
  font-family:Cinzel,serif;
  letter-spacing:.45em;
  color:var(--silver);
  font-size:clamp(2.5rem,6vw,4rem);
  animation:breathe 4s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{opacity:.6;letter-spacing:.35em}
  50%{opacity:1;letter-spacing:.6em}
}

.gate p{
  margin-top:1.2rem;
  font-size:.75rem;
  letter-spacing:.35em;
  color:var(--muted);
}

.gate input{
  margin-top:3rem;
  background:none;
  border:none;
  border-bottom:1px solid rgba(255,255,255,.25);
  color:#fff;
  text-align:center;
  font-size:1rem;
  letter-spacing:.3em;
  padding:.6rem;
  outline:none;
  width:240px;
}

.error{
  margin-top:1.5rem;
  font-size:.7rem;
  letter-spacing:.4em;
  color:var(--red);
  opacity:0;
  transition:opacity .3s ease;
}

.error.show{opacity:1}

/* WRONG CODE GLITCH */
.gate.glitch{
  animation:glitch .35s linear;
}

@keyframes glitch{
  0%{transform:translate(0)}
  25%{transform:translate(-2px,1px)}
  50%{transform:translate(2px,-1px)}
  75%{transform:translate(-1px,2px)}
  100%{transform:translate(0)}
}

/* UNLOCK */
.unlock h1{
  animation:unlock 1.2s forwards;
}

@keyframes unlock{
  0%{opacity:1;transform:scale(1)}
  50%{opacity:.3;letter-spacing:1em}
  100%{opacity:0;transform:scale(.8)}
}
</style>
</head>

<body>

<div class="veil"></div>

<div class="gate">
  <h1>ACCESS</h1>
  <p>ENTER AUTHORIZATION CODE</p>
  <input type="password" id="pw" autofocus>
  <div class="error" id="err">ACCESS DENIED</div>
</div>

<script>
const PASSWORD = "CARTEL"; // change later

const pw = document.getElementById("pw");
const gate = document.querySelector(".gate");
const err = document.getElementById("err");
const veil = document.querySelector(".veil");

/* Auto-redirect if already authorized */
if(localStorage.getItem("cartel_access")==="true"){
  window.location.href="index.html";
}

pw.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    if(pw.value===PASSWORD){
      gate.classList.add("unlock");
      veil.style.opacity=1;
      localStorage.setItem("cartel_access","true");

      setTimeout(()=>{
        window.location.href="index.html";
      },1200);
    }else{
      gate.classList.add("glitch");
      err.classList.add("show");
      pw.value="";

      setTimeout(()=>{
        gate.classList.remove("glitch");
      },400);
    }
  }
});
</script>

</body>
</html>
