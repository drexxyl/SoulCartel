<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS · SOUL CARTEL</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --text:#eee;
  --muted:rgba(255,255,255,.5);
  --red:#8b0000;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:radial-gradient(circle at top,#0b0b0b,#000);
  color:var(--text);
  font-family:Inter,sans-serif;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.veil{
  position:fixed;
  inset:0;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.2s ease;
  z-index:10;
}

.gate{
  text-align:center;
  z-index:2;
}

#sigil{
  font-family:Cinzel,serif;
  letter-spacing:.4em;
  opacity:.7;
  animation:breathe 4s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{letter-spacing:.3em;opacity:.5}
  50%{letter-spacing:.7em;opacity:1}
}

.gate p{
  margin:1.2rem 0;
  font-size:.75rem;
  letter-spacing:.35em;
  color:var(--muted);
}

input{
  background:transparent;
  border:1px solid rgba(255,255,255,.2);
  color:white;
  padding:.7rem 1rem;
  text-align:center;
  letter-spacing:.3em;
  outline:none;
}

.error{
  margin-top:1rem;
  font-size:.7rem;
  color:var(--red);
  letter-spacing:.25em;
  opacity:0;
  transition:.3s;
}

.error.show{opacity:1}

.gate.glitch{animation:glitch .35s linear}
@keyframes glitch{
  0%{transform:translate(0)}
  25%{transform:translate(-2px,1px)}
  50%{transform:translate(2px,-1px)}
  75%{transform:translate(-1px,2px)}
  100%{transform:translate(0)}
}

.unlock #sigil{
  animation:unlock 1.2s forwards;
}

@keyframes unlock{
  0%{opacity:1}
  50%{opacity:.3;letter-spacing:1em}
  100%{opacity:0}
}
</style>
</head>

<body>

<div class="veil"></div>

<div class="gate">
  <h1 id="sigil">ACCESS</h1>
  <p>ENTER AUTHORIZATION CODE</p>
  <input id="pw" type="password" autofocus>
  <div class="error" id="err">ACCESS DENIED</div>
</div>

<script>
const PASSWORD = "CARTEL";
const TIME_LIMIT = 5 * 60 * 1000; // 5 minutes

const pw = document.getElementById("pw");
const gate = document.querySelector(".gate");
const err = document.getElementById("err");
const veil = document.querySelector(".veil");

pw.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    if(pw.value===PASSWORD){
      gate.classList.add("unlock");
      veil.style.opacity=1;

      sessionStorage.setItem("cartel_access","true");
      sessionStorage.setItem("cartel_time",Date.now());

      setTimeout(()=>{
        location.href="index.html";
      },1200);
    }else{
      gate.classList.add("glitch");
      err.classList.add("show");
      pw.value="";
      setTimeout(()=>gate.classList.remove("glitch"),400);
    }
  }
});
</script>

</body>
</html>
