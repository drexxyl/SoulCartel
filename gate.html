<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS</title>

<style>
body{
  background:black;
  color:white;
  font-family:Inter, sans-serif;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
input{
  background:black;
  border:1px solid white;
  color:white;
  padding:1rem;
}
</style>
</head>

<body>

<div>
  <p>ENTER PASSWORD</p>
  <input id="pw" type="password">
</div>

<script>
document.getElementById("pw").addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    if(e.target.value==="CARTEL"){
      sessionStorage.setItem("access","true");
      window.location.href="index.html";
    }else{
      alert("NO");
    }
  }
});
</script>

</body>
</html>
