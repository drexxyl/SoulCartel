<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS · SOUL CARTEL</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --text:#eee;
  --muted:rgba(255,255,255,.5);
  --red:#8b0000;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:radial-gradient(circle at top,#0b0b0b,#000);
  color:var(--text);
  font-family:Inter,sans-serif;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.veil{
  position:fixed;
  inset:0;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.2s ease;
  z-index:10;
}

.gate{
  text-align:center;
  z-index:2;
}

#sigil{
  font-family:Cinzel,serif;
  letter-spacing:.4em;
  opacity:.8;
  transition:all .8s ease;
}

.status{
  margin-top:1rem;
  font-size:.7rem;
  letter-spacing:.3em;
  color:var(--muted);
  opacity:0;
  transition:.4s;
}
.status.show{opacity:1}

input{
  margin-top:1.5rem;
  background:transparent;
  border:1px solid rgba(255,255,255,.2);
  color:white;
  padding:.7rem 1rem;
  text-align:center;
  letter-spacing:.3em;
  outline:none;
}

.error{
  margin-top:1rem;
  font-size:.7rem;
  color:var(--red);
  letter-spacing:.25em;
  opacity:0;
  transition:.3s;
}
.error.show{opacity:1}

/* ===== ANIMATIONS ===== */

/* GOD */
.god #sigil{animation:god 1s ease forwards}
@keyframes god{
  0%{transform:scale(1)}
  40%{transform:scale(1.15);filter:blur(1px)}
  100%{transform:scale(1);filter:none}
}

/* SIN */
.sin{animation:sin .8s ease}
@keyframes sin{
  0%{transform:translateY(0)}
  50%{transform:translateY(18px)}
  100%{transform:translateY(0)}
}

/* DEATH */
.death #sigil{animation:death 1.4s ease}
@keyframes death{
  0%{opacity:1}
  50%{opacity:.25}
  100%{opacity:1}
}

/* SOUL */
.soul #sigil{animation:soul 1.2s ease}
@keyframes soul{
  0%{letter-spacing:.3em}
  50%{letter-spacing:.7em}
  100%{letter-spacing:.3em}
}

/* CARTEL */
.cartel{animation:cartel .7s ease}
@keyframes cartel{
  0%{transform:translateX(0)}
  50%{transform:translateX(10px)}
  100%{transform:translateX(0)}
}

/* APOCALYPSE */
.apocalypse{animation:apoc 1.8s ease}
@keyframes apoc{
  0%{filter:brightness(1)}
  100%{filter:brightness(.6)}
}

/* ADMIN UI */
.admin{
  position:fixed;
  bottom:30px;
  right:30px;
  font-size:.6rem;
  letter-spacing:.3em;
  opacity:0;
  transition:.6s;
}
.admin.show{opacity:.6}
</style>
</head>

<body>

<div class="veil"></div>

<div class="gate" id="gate">
  <h1 id="sigil">ACCESS</h1>
  <div class="status" id="status">VERIFYING SOUL SIGNATURE</div>
  <input id="pw" type="password" autocomplete="off" autofocus>
  <div class="error" id="err">SIGNATURE REJECTED</div>
</div>

<div class="admin" id="adminUI">ADMIN AUTHORITY ACTIVE</div>

<script>
const ACCESS = {
  "V.":{rank:"GOD",anim:"god",delay:500,admin:true,msg:"ABSOLUTE AUTHORITY"},
  "SIN":{rank:2,anim:"sin",delay:800,msg:"SIN ACCEPTED"},
  "DEATH":{rank:3,anim:"death",delay:1100,msg:"DEATH VERIFIED"},
  "SOUL":{rank:4,anim:"soul",delay:1000,msg:"SOUL MATCH"},
  "CARTEL":{rank:5,anim:"cartel",delay:900,msg:"CARTEL GRANTED"},
  "APOCALYPSE":{rank:6,anim:"apocalypse",delay:1600,msg:"FINAL EVENT"}
};

const pw = document.getElementById("pw");
const gate = document.getElementById("gate");
const veil = document.querySelector(".veil");
const status = document.getElementById("status");
const err = document.getElementById("err");
const adminUI = document.getElementById("adminUI");

pw.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;

  const v = pw.value.trim().toUpperCase();
  gate.className="gate";
  err.classList.remove("show");

  if(!ACCESS[v]){
    err.classList.add("show");
    pw.value="";
    return;
  }

  const a = ACCESS[v];
  status.textContent="VERIFYING SOUL SIGNATURE";
  status.classList.add("show");

  gate.classList.add(a.anim);

  setTimeout(()=>{
    status.textContent=a.msg;
  },300);

  if(a.admin){
    adminUI.classList.add("show");
  }

  sessionStorage.setItem("cartel_access","true");
  sessionStorage.setItem("cartel_rank",a.rank);

  setTimeout(()=>veil.style.opacity=1,a.delay);
  setTimeout(()=>location.href="home.html",a.delay+700);
});
</script>

</body>
</html>
